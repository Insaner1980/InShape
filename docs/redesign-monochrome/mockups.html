<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InShape monochrome mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;--surface:#F4F4F4;--surface2:#EBEBEB;--line:#E3E3E3;--strong:#0B0B0B;
  --text:#0B0B0B;--text2:#5E5E5E;--text3:#8E8E8E;--ink:#0B0B0B;--onink:#FFFFFF;--error:#B3261E;
  --scrim:rgba(11,11,11,.32);
}
.dark{
  --bg:#0B0B0B;--surface:#1A1A1A;--surface2:#242424;--line:#2A2A2A;--strong:#F5F5F5;
  --text:#F5F5F5;--text2:#A3A3A3;--text3:#6F6F6F;--ink:#F5F5F5;--onink:#0B0B0B;--error:#F2B8B5;
  --scrim:rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#D9D9D9;font-family:Inter,system-ui,sans-serif;font-feature-settings:"tnum" 1,"cv11" 1;-webkit-font-smoothing:antialiased;padding:32px;display:flex;flex-wrap:wrap;gap:32px}
body.single{padding:0;background:transparent;display:block}
.ms{font-family:'Material Symbols Outlined';font-size:24px;line-height:1;font-weight:400;font-style:normal;display:inline-block;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
figure{display:flex;flex-direction:column;gap:12px}
figcaption{font-size:14px;color:#333;font-weight:500}
body.single figcaption{display:none}
.screen{width:360px;height:760px;background:var(--bg);color:var(--text);position:relative;overflow:hidden;display:flex;flex-direction:column}
.status{height:32px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:500;color:var(--text)}
.content{padding:0 20px;display:flex;flex-direction:column;flex:1;min-height:0}
.bar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 4px}
.iconbtn{width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:var(--text)}
.t-display{font-size:56px;line-height:60px;font-weight:500;letter-spacing:-.03em}
.t-display-s{font-size:40px;line-height:44px;font-weight:500;letter-spacing:-.03em}
.t-headline{font-size:28px;line-height:34px;font-weight:600;letter-spacing:-.02em}
.t-title{font-size:20px;line-height:26px;font-weight:600;letter-spacing:-.01em}
.t-title-s{font-size:16px;line-height:22px;font-weight:600}
.t-body{font-size:15px;line-height:22px}
.t-body-s{font-size:13px;line-height:18px}
.t-label{font-size:12px;line-height:16px;font-weight:500;letter-spacing:.01em}
.c2{color:var(--text2)}.c3{color:var(--text3)}
.btn{height:56px;border-radius:14px;background:var(--ink);color:var(--onink);display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600}
.btn .ms{font-size:20px}
.btn-o{height:40px;border-radius:12px;border:1px solid var(--strong);display:flex;align-items:center;justify-content:center;padding:0 16px;font-size:14px;font-weight:600}
.link{font-size:15px;font-weight:600;color:var(--text)}
.row{display:flex;align-items:center;justify-content:space-between}
.list .item{min-height:52px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:14px 0;gap:12px}
.list .item:last-child{border-bottom:none}
.card{border:1px solid var(--strong);border-radius:20px;padding:20px}
.inset{background:var(--surface);border-radius:12px;padding:12px 14px}
.seg{display:flex;background:var(--surface);border-radius:12px;padding:4px;height:44px}
.seg span{flex:1;display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:14px;font-weight:500;color:var(--text2)}
.seg span.on{background:var(--ink);color:var(--onink);font-weight:600}
.nav{height:72px;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;margin-top:auto;background:var(--bg)}
.nav div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--text3);width:96px}
.nav div.on{color:var(--text);font-weight:600}
.dots{display:flex;justify-content:space-between}
.dot{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--text3);width:36px}
.dot i{width:32px;height:32px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-style:normal}
.dot.done i{background:var(--ink);color:var(--onink)}
.dot.today{color:var(--text);font-weight:600}
.dot.today i{background:var(--bg);box-shadow:inset 0 0 0 2px var(--strong)}
.segbar{display:flex;gap:4px}
.segbar b{flex:1;height:4px;border-radius:2px;background:var(--surface2)}
.segbar b.d{background:var(--ink)}
.segbar b.c{background:var(--text3)}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:8px;align-items:center}
.cell{height:52px;border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600}
.cell.cur{background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--strong)}
.chk{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;justify-self:center}
.chk.d{background:var(--ink);color:var(--onink)}
.chk.e{box-shadow:inset 0 0 0 1.5px var(--line);color:var(--text3)}
.metric{background:var(--surface);border-radius:12px;padding:14px}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:20px 20px 0 0;padding:12px 20px 24px}
.grab{width:32px;height:4px;border-radius:2px;background:var(--surface2);margin:0 auto 16px}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.menu{position:absolute;right:20px;background:var(--bg);border-radius:14px;box-shadow:0 0 0 1px var(--line),0 12px 32px rgba(0,0,0,.14);padding:6px 0;width:220px}
.menu div{height:48px;display:flex;align-items:center;gap:12px;padding:0 16px;font-size:15px}
.menu .sep{height:1px;background:var(--line);padding:0;margin:6px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px;text-align:center}
.cal span{width:36px;height:36px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px}
.cal .h{font-size:12px;color:var(--text3);height:24px}
.cal .w{background:var(--ink);color:var(--onink);font-weight:600}
.cal .t{box-shadow:inset 0 0 0 1.5px var(--strong);font-weight:600}
.switch{width:44px;height:26px;border-radius:13px;background:var(--ink);position:relative}
.switch:after{content:"";position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--onink)}
.switch.off{background:var(--surface2)}
.switch.off:after{left:3px;right:auto;background:var(--bg)}
.chip{height:32px;padding:0 12px;border-radius:8px;background:var(--surface);display:inline-flex;align-items:center;font-size:13px;font-weight:500}
.sec{font-size:12px;line-height:16px;font-weight:500;color:var(--text2);margin:32px 0 4px}
</style>
</head>
<body>
