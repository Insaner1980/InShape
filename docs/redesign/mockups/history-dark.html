<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>History</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{font:inherit}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div style="--bg:#0E1114;--s1:#171B20;--s2:#20262D;--sel:#39424D;--mute:#39424D;--line:#2A313A;--tx:#F2F4F5;--tx2:#A3ADB8;--ac:#C5F25A;--onac:#141A05;--acs:#26330F;--act:#D4F77F;--mark:#C5F25A;--pain:#FF9A62;--stiff:#7FB2FF;--sh:none;--fd:'Space Grotesk',Inter,sans-serif; width:390px; height:990px; box-sizing:border-box; background:var(--bg); color:var(--tx); font-family:Inter,system-ui,sans-serif; display:flex; flex-direction:column">

<header style="display:flex; justify-content:space-between; align-items:center; padding:44px 20px 0">
<h1 style="margin:0; font-family:var(--fd); font-size:32px; line-height:38px; font-weight:700; letter-spacing:-.02em">History</h1>
<button type="button" style="height:44px; padding:0 16px 0 12px; border-radius:22px; border:0; background:var(--s1); box-shadow:var(--sh); color:var(--tx); font-size:14px; font-weight:600; display:flex; align-items:center; gap:6px">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
Past workout
</button>
</header>

<main style="display:flex; flex-direction:column; gap:12px; padding:20px 20px 0">

<section style="background:var(--s1); box-shadow:var(--sh); border-radius:24px; padding:12px 16px 16px; display:flex; flex-direction:column; gap:8px">
<div style="display:flex; justify-content:space-between; align-items:center">
<button type="button" aria-label="Previous month" style="width:44px; height:44px; border:0; background:transparent; color:var(--tx); display:flex; align-items:center; justify-content:center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
<h2 style="margin:0; font-size:17px; line-height:22px; font-weight:600">November 2026</h2>
<button type="button" aria-label="Next month" style="width:44px; height:44px; border:0; background:transparent; color:var(--tx); display:flex; align-items:center; justify-content:center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
</div>
<div style="display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)); font-size:12px; font-weight:600; color:var(--tx2); text-align:center">
<span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
</div>
<div style="display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)); row-gap:4px">
<sc-for list="{{days}}" as="day" hint-placeholder-count="36">
<div style="height:40px; display:flex; align-items:center; justify-content:center">
<sc-if value="{{day.done}}" hint-placeholder-val="{{false}}">
<span style="width:36px; height:36px; border-radius:18px; background:var(--ac); color:var(--onac); display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700">{{day.n}}</span>
</sc-if>
<sc-if value="{{day.today}}" hint-placeholder-val="{{false}}">
<span style="width:36px; height:36px; border-radius:18px; box-sizing:border-box; border:2px solid var(--mark); display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700">{{day.n}}</span>
</sc-if>
<sc-if value="{{day.plain}}" hint-placeholder-val="{{true}}">
<span style="font-size:15px; color:var(--tx)">{{day.n}}</span>
</sc-if>
</div>
</sc-for>
</div>
<div style="display:flex; gap:20px; padding:8px 4px 0; border-top:1px solid var(--line)">
<div style="display:flex; align-items:center; gap:8px; font-size:13px; color:var(--tx2)"><span style="width:12px; height:12px; border-radius:6px; background:var(--ac)"></span>Workout</div>
<div style="display:flex; align-items:center; gap:8px; font-size:13px; color:var(--tx2)"><span style="width:12px; height:12px; border-radius:6px; box-sizing:border-box; border:2px solid var(--mark)"></span>Today</div>
</div>
</section>

<section style="background:var(--s1); box-shadow:var(--sh); border-radius:24px; padding:16px 0; display:grid; grid-template-columns:repeat(3, minmax(0, 1fr))">
<div style="display:flex; flex-direction:column; gap:2px; padding:0 16px">
<span style="font-family:var(--fd); font-size:24px; line-height:28px; font-weight:700">5</span>
<span style="font-size:12px; line-height:16px; color:var(--tx2)">workouts</span>
</div>
<div style="display:flex; flex-direction:column; gap:2px; padding:0 16px; border-left:1px solid var(--line)">
<span style="font-family:var(--fd); font-size:24px; line-height:28px; font-weight:700">4.3 h</span>
<span style="font-size:12px; line-height:16px; color:var(--tx2)">recorded time</span>
</div>
<div style="display:flex; flex-direction:column; gap:2px; padding:0 16px; border-left:1px solid var(--line)">
<span style="font-family:var(--fd); font-size:24px; line-height:28px; font-weight:700">6.2</span>
<span style="font-size:12px; line-height:16px; color:var(--tx2)">average effort</span>
</div>
</section>

<h2 style="margin:0; padding:12px 4px 0; font-size:15px; line-height:20px; font-weight:600; color:var(--tx2)">Workouts in November</h2>

<section style="background:var(--s1); box-shadow:var(--sh); border-radius:24px; padding:0 16px; display:flex; flex-direction:column">
<sc-for list="{{workouts}}" as="w" hint-placeholder-count="3">
<a href="Workout.dc.html" style="display:flex; align-items:center; gap:12px; min-height:68px; text-decoration:none; color:var(--tx); border-bottom:1px solid var(--line)">
<div style="width:44px; height:44px; border-radius:12px; background:var(--s2); display:flex; flex-direction:column; align-items:center; justify-content:center">
<span style="font-family:var(--fd); font-size:16px; line-height:18px; font-weight:700">{{w.day}}</span>
<span style="font-size:11px; line-height:13px; color:var(--tx2)">{{w.wd}}</span>
</div>
<div style="display:flex; flex-direction:column; gap:2px; flex-grow:1">
<span style="font-size:16px; font-weight:600">{{w.name}}</span>
<span style="font-size:13px; color:var(--tx2)">{{w.meta}}</span>
</div>
<span style="height:28px; padding:0 10px; border-radius:14px; background:var(--s2); display:flex; align-items:center; font-size:13px; font-weight:600; color:var(--tx)">{{w.effort}}</span>
</a>
</sc-for>
</section>
</main>

<nav aria-label="Main" style="margin-top:auto; display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); padding:8px 12px 20px; background:var(--s1); border-top:1px solid var(--line)">
<a href="Main.dc.html" style="display:flex; flex-direction:column; align-items:center; gap:4px; padding:4px 0; text-decoration:none; color:var(--tx2); font-size:12px; font-weight:500">
<span style="width:56px; height:30px; display:flex; align-items:center; justify-content:center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg></span>
Today
</a>
<a href="History.dc.html" aria-current="page" style="display:flex; flex-direction:column; align-items:center; gap:4px; padding:4px 0; text-decoration:none; color:var(--tx); font-size:12px; font-weight:700">
<span style="width:56px; height:30px; border-radius:15px; background:var(--acs); color:var(--act); display:flex; align-items:center; justify-content:center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M8 3v4M16 3v4"/></svg></span>
History
</a>
<a href="Progress.dc.html" style="display:flex; flex-direction:column; align-items:center; gap:4px; padding:4px 0; text-decoration:none; color:var(--tx2); font-size:12px; font-weight:500">
<span style="width:56px; height:30px; display:flex; align-items:center; justify-content:center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></span>
Progress
</a>
<a href="Library.dc.html" style="display:flex; flex-direction:column; align-items:center; gap:4px; padding:4px 0; text-decoration:none; color:var(--tx2); font-size:12px; font-weight:500">
<span style="width:56px; height:30px; display:flex; align-items:center; justify-content:center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M6 7v10M18 7v10M3 9.5v5M21 9.5v5"/></svg></span>
Library
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":990}}'>
class Component extends DCLogic {
renderVals() {
var doneDays = [2, 4, 6, 9, 11];
var today = 13;
var days = [];
for (var b = 0; b < 6; b++) { days.push({ n: '', done: false, today: false, plain: false }); }
for (var d = 1; d <= 30; d++) {
var done = doneDays.indexOf(d) !== -1;
var isToday = d === today;
days.push({ n: d, done: done, today: isToday, plain: !done && !isToday });
}
var workouts = [
{ day: 11, wd: 'Wed', name: 'Full body A', meta: '52 min, 7 exercises', effort: 'Effort 6' },
{ day: 9, wd: 'Mon', name: 'Full body B', meta: '58 min, 7 exercises', effort: 'Effort 7' },
{ day: 6, wd: 'Fri', name: 'Short 20 min', meta: '24 min, 4 exercises', effort: 'Effort 5' }
];
return { days: days, workouts: workouts };
}
}
</script>
</body>
</html>
