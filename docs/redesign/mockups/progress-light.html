<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Progress, light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{font:inherit}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div style="--bg:#F3F4F6;--s1:#FFFFFF;--s2:#ECEEF1;--sel:#FFFFFF;--mute:#D5DAE0;--line:#E4E7EB;--tx:#12161B;--tx2:#5A6470;--ac:#C5F25A;--onac:#141A05;--acs:#E9F8C2;--act:#3F6200;--mark:#5E8C00;--pain:#B8490B;--stiff:#2459B0;--sh:0 1px 2px rgba(18,22,27,.05),0 8px 24px rgba(18,22,27,.07);--fd:'Space Grotesk',Inter,sans-serif; width:390px; height:1030px; box-sizing:border-box; background:var(--bg); color:var(--tx); font-family:Inter,system-ui,sans-serif; display:flex; flex-direction:column">

<header style="padding:44px 20px 0">
<h1 style="margin:0; font-family:var(--fd); font-size:32px; line-height:38px; font-weight:700; letter-spacing:-.02em">Progress</h1>
</header>

<main style="display:flex; flex-direction:column; gap:12px; padding:16px 20px 0">

<div role="group" aria-label="Period" style="display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:4px; padding:4px; border-radius:26px; background:#E4E7EB">
<button type="button" aria-pressed="false" style="height:44px; border-radius:22px; border:0; background:transparent; color:var(--tx2); font-size:14px; font-weight:600">4 weeks</button>
<button type="button" aria-pressed="true" style="height:44px; border-radius:22px; border:0; background:var(--sel); box-shadow:0 1px 2px rgba(18,22,27,.10); color:var(--tx); font-size:14px; font-weight:600">12 weeks</button>
<button type="button" aria-pressed="false" style="height:44px; border-radius:22px; border:0; background:transparent; color:var(--tx2); font-size:14px; font-weight:600">All</button>
</div>

<section style="background:var(--s1); box-shadow:var(--sh); border-radius:24px; padding:20px; display:flex; flex-direction:column; gap:16px">
<div style="display:flex; justify-content:space-between; align-items:flex-start">
<div style="display:flex; flex-direction:column; gap:4px">
<h2 style="margin:0; font-size:15px; line-height:20px; font-weight:600; color:var(--tx2)">Workouts per week</h2>
<div style="display:flex; align-items:baseline; gap:8px">
<span style="font-family:var(--fd); font-size:36px; line-height:40px; font-weight:700; letter-spacing:-.02em">2.5</span>
<span style="font-size:14px; color:var(--tx2)">on average</span>
</div>
</div>
<span style="height:28px; padding:0 10px; border-radius:14px; background:var(--acs); color:var(--act); display:flex; align-items:center; font-size:13px; font-weight:600">Goal 3</span>
</div>
<div role="img" aria-label="Bar chart of workouts per week over 12 weeks, goal line at 3" style="position:relative; height:96px; display:grid; grid-template-columns:repeat(12, minmax(0, 1fr)); gap:6px; align-items:end">
<span style="position:absolute; left:0; right:0; bottom:84px; border-top:1.5px dashed var(--mute)"></span>
<span style="height:56px; border-radius:6px; background:var(--mute)"></span>
<span style="height:84px; border-radius:6px; background:var(--mark)"></span>
<span style="height:84px; border-radius:6px; background:var(--mark)"></span>
<span style="height:56px; border-radius:6px; background:var(--mute)"></span>
<span style="height:84px; border-radius:6px; background:var(--mark)"></span>
<span style="height:28px; border-radius:6px; background:var(--mute)"></span>
<span style="height:84px; border-radius:6px; background:var(--mark)"></span>
<span style="height:84px; border-radius:6px; background:var(--mark)"></span>
<span style="height:56px; border-radius:6px; background:var(--mute)"></span>
<span style="height:84px; border-radius:6px; background:var(--mark)"></span>
<span style="height:84px; border-radius:6px; background:var(--mark)"></span>
<span style="height:56px; border-radius:6px; box-sizing:border-box; border:1.5px dashed var(--tx2)"></span>
</div>
<div style="display:flex; justify-content:space-between; font-size:12px; color:var(--tx2)">
<span>24 August</span>
<span>This week, in progress</span>
</div>
</section>

<section style="background:var(--s1); box-shadow:var(--sh); border-radius:24px; padding:20px; display:flex; flex-direction:column; gap:12px">
<div style="display:flex; justify-content:space-between; align-items:center">
<button type="button" style="height:44px; margin:-8px 0 -8px -14px; padding:0 14px; border-radius:22px; border:0; background:transparent; color:var(--tx); font-size:17px; font-weight:600; display:flex; align-items:center; gap:6px">
Lat pulldown
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--tx2)"><path d="M6 9l6 6 6-6"/></svg>
</button>
<span style="height:28px; padding:0 10px; border-radius:14px; background:var(--acs); color:var(--act); display:flex; align-items:center; font-size:13px; font-weight:600">+7.5 kg</span>
</div>
<div style="display:flex; align-items:baseline; gap:8px">
<span style="font-family:var(--fd); font-size:36px; line-height:40px; font-weight:700; letter-spacing:-.02em">27.5 kg</span>
<span style="font-size:14px; color:var(--tx2)">top set, was 20 kg</span>
</div>
<svg role="img" aria-label="Line chart of top set weight rising from 20 kg to 27.5 kg" width="310" height="100" viewBox="0 0 310 100" fill="none">
<path d="M0 88.5h310" style="stroke:var(--line)" stroke-width="1"/>
<path d="M0 50h310" style="stroke:var(--line)" stroke-width="1" stroke-dasharray="3 5"/>
<polyline points="6,88 33,88 60,62.7 87,62.7 114,37.3 141,62.7 168,37.3 195,37.3 222,37.3 249,12 276,12 303,12" style="stroke:var(--mark)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="303" cy="12" r="5" style="fill:var(--mark)"/>
</svg>
</section>

<section style="background:var(--s1); box-shadow:var(--sh); border-radius:24px; padding:20px; display:flex; flex-direction:column; gap:12px">
<div style="display:flex; flex-direction:column; gap:2px">
<button type="button" style="align-self:flex-start; height:44px; margin:-8px 0 -8px -14px; padding:0 14px; border-radius:22px; border:0; background:transparent; color:var(--tx); font-size:17px; font-weight:600; display:flex; align-items:center; gap:6px">
Lower back
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--tx2)"><path d="M6 9l6 6 6-6"/></svg>
</button>
<span style="font-size:13px; color:var(--tx2)">After workouts, scale 0 to 10</span>
</div>
<div style="display:flex; gap:8px">
<span style="height:32px; padding:0 12px; border-radius:16px; background:var(--s2); display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600"><span style="width:16px; height:3px; border-radius:2px; background:var(--pain)"></span>Pain, now 2</span>
<span style="height:32px; padding:0 12px; border-radius:16px; background:var(--s2); display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600"><span style="width:16px; height:0; border-top:3px dashed var(--stiff)"></span>Stiffness, now 3</span>
</div>
<svg role="img" aria-label="Line chart: pain falling from 5 to 2 and stiffness falling from 6 to 3" width="310" height="100" viewBox="0 0 310 100" fill="none">
<path d="M0 90.5h310" style="stroke:var(--line)" stroke-width="1"/>
<path d="M0 40h310" style="stroke:var(--line)" stroke-width="1" stroke-dasharray="3 5"/>
<polyline points="6,30 33,30 60,40 87,40 114,40 141,50 168,50 195,50 222,60 249,50 276,60 303,60" style="stroke:var(--stiff)" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="6,40 33,40 60,50 87,50 114,60 141,50 168,60 195,60 222,70 249,70 276,66 303,70" style="stroke:var(--pain)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="303" cy="60" r="5" style="fill:var(--stiff)"/>
<circle cx="303" cy="70" r="5" style="fill:var(--pain)"/>
</svg>
</section>
</main>

<nav aria-label="Main" style="margin-top:auto; display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); padding:8px 12px 20px; background:var(--s1); border-top:1px solid var(--line)">
<a href="TodayLight.dc.html" style="display:flex; flex-direction:column; align-items:center; gap:4px; padding:4px 0; text-decoration:none; color:var(--tx2); font-size:12px; font-weight:500">
<span style="width:56px; height:30px; display:flex; align-items:center; justify-content:center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg></span>
Today
</a>
<a href="History.dc.html" style="display:flex; flex-direction:column; align-items:center; gap:4px; padding:4px 0; text-decoration:none; color:var(--tx2); font-size:12px; font-weight:500">
<span style="width:56px; height:30px; display:flex; align-items:center; justify-content:center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M8 3v4M16 3v4"/></svg></span>
History
</a>
<a href="ProgressLight.dc.html" aria-current="page" style="display:flex; flex-direction:column; align-items:center; gap:4px; padding:4px 0; text-decoration:none; color:var(--tx); font-size:12px; font-weight:700">
<span style="width:56px; height:30px; border-radius:15px; background:var(--acs); color:var(--act); display:flex; align-items:center; justify-content:center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></span>
Progress
</a>
<a href="Library.dc.html" style="display:flex; flex-direction:column; align-items:center; gap:4px; padding:4px 0; text-decoration:none; color:var(--tx2); font-size:12px; font-weight:500">
<span style="width:56px; height:30px; display:flex; align-items:center; justify-content:center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M6 7v10M18 7v10M3 9.5v5M21 9.5v5"/></svg></span>
Library
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1030}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
