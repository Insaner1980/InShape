<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logging a workout, light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{font:inherit}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div style="--bg:#F3F4F6;--s1:#FFFFFF;--s2:#ECEEF1;--sel:#FFFFFF;--mute:#D5DAE0;--line:#E4E7EB;--tx:#12161B;--tx2:#5A6470;--ac:#C5F25A;--onac:#141A05;--acs:#E9F8C2;--act:#3F6200;--mark:#5E8C00;--pain:#B8490B;--stiff:#2459B0;--sh:0 1px 2px rgba(18,22,27,.05),0 8px 24px rgba(18,22,27,.07);--fd:'Space Grotesk',Inter,sans-serif; width:390px; height:960px; box-sizing:border-box; background:var(--bg); color:var(--tx); font-family:Inter,system-ui,sans-serif; display:flex; flex-direction:column">

<header style="display:flex; align-items:center; gap:8px; padding:44px 20px 0 8px">
<a href="TodayLight.dc.html" aria-label="Back to Today" style="width:44px; height:44px; display:flex; align-items:center; justify-content:center; color:var(--tx)">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
</a>
<div style="display:flex; flex-direction:column; gap:1px; flex-grow:1">
<span style="font-size:17px; line-height:22px; font-weight:600">Full body B</span>
<span style="font-size:13px; line-height:18px; color:var(--tx2)">24 min elapsed</span>
</div>
<button type="button" style="height:44px; padding:0 20px; border-radius:22px; border:1.5px solid var(--mute); background:transparent; color:var(--tx); font-size:15px; font-weight:600">Finish</button>
</header>

<div style="display:flex; flex-direction:column; gap:8px; padding:16px 20px 0">
<div role="img" aria-label="Exercise 4 of 7" style="display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)); gap:4px">
<span style="height:6px; border-radius:3px; background:var(--mark)"></span>
<span style="height:6px; border-radius:3px; background:var(--mark)"></span>
<span style="height:6px; border-radius:3px; background:var(--mark)"></span>
<span style="height:6px; border-radius:3px; background:var(--tx)"></span>
<span style="height:6px; border-radius:3px; background:var(--mute)"></span>
<span style="height:6px; border-radius:3px; background:var(--mute)"></span>
<span style="height:6px; border-radius:3px; background:var(--mute)"></span>
</div>
<span style="font-size:13px; line-height:18px; font-weight:500; color:var(--tx2)">Exercise 4 of 7</span>
</div>

<main style="display:flex; flex-direction:column; gap:12px; padding:16px 20px 0">

<section style="background:var(--s1); box-shadow:var(--sh); border-radius:24px; padding:20px; display:flex; flex-direction:column; gap:16px">
<div style="display:flex; flex-direction:column; gap:10px">
<div style="display:flex; justify-content:space-between; align-items:center">
<h1 style="margin:0; font-family:var(--fd); font-size:28px; line-height:32px; font-weight:700; letter-spacing:-.02em">Lat pulldown</h1>
<a href="Library.dc.html" style="font-size:14px; font-weight:600; color:var(--act); text-decoration:none; padding:12px 0">Details</a>
</div>
<div style="display:flex; flex-wrap:wrap; gap:6px">
<span style="height:28px; padding:0 10px; border-radius:14px; background:var(--s2); display:flex; align-items:center; font-size:13px; font-weight:500; color:var(--tx2)">Seat 4</span>
<span style="height:28px; padding:0 10px; border-radius:14px; background:var(--s2); display:flex; align-items:center; font-size:13px; font-weight:500; color:var(--tx2)">Thigh pad 2</span>
<span style="height:28px; padding:0 10px; border-radius:14px; background:var(--s2); display:flex; align-items:center; font-size:13px; font-weight:500; color:var(--tx2)">Wide bar</span>
</div>
</div>

<div style="display:flex; justify-content:space-between; align-items:center; background:var(--acs); color:var(--act); border-radius:14px; padding:12px 14px">
<span style="font-size:13px; font-weight:600">Last time, Wednesday</span>
<span style="font-family:var(--fd); font-size:16px; font-weight:700">3 × 10 at 25 kg</span>
</div>

<div style="display:flex; flex-direction:column; gap:8px">
<div style="display:grid; grid-template-columns:28px minmax(0, 1fr) minmax(0, 1fr) 52px; gap:8px; font-size:12px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--tx2)">
<span>Set</span><span style="text-align:center">kg</span><span style="text-align:center">Reps</span><span style="text-align:center">Done</span>
</div>
<div style="display:grid; grid-template-columns:28px minmax(0, 1fr) minmax(0, 1fr) 52px; gap:8px; align-items:center">
<span style="font-family:var(--fd); font-size:18px; font-weight:700; color:var(--tx2)">1</span>
<input aria-label="Set 1 weight in kg" inputmode="decimal" value="27.5" style="height:52px; width:100%; box-sizing:border-box; border:0; border-radius:14px; background:var(--s2); color:var(--tx); text-align:center; font-family:var(--fd); font-size:20px; font-weight:600">
<input aria-label="Set 1 reps" inputmode="numeric" value="10" style="height:52px; width:100%; box-sizing:border-box; border:0; border-radius:14px; background:var(--s2); color:var(--tx); text-align:center; font-family:var(--fd); font-size:20px; font-weight:600">
<button type="button" aria-label="Set 1 done" aria-pressed="true" style="width:52px; height:52px; border-radius:26px; border:0; background:var(--ac); color:var(--onac); display:flex; align-items:center; justify-content:center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
</div>
<div style="display:grid; grid-template-columns:28px minmax(0, 1fr) minmax(0, 1fr) 52px; gap:8px; align-items:center">
<span style="font-family:var(--fd); font-size:18px; font-weight:700; color:var(--tx2)">2</span>
<input aria-label="Set 2 weight in kg" inputmode="decimal" value="27.5" style="height:52px; width:100%; box-sizing:border-box; border:0; border-radius:14px; background:var(--s2); color:var(--tx); text-align:center; font-family:var(--fd); font-size:20px; font-weight:600">
<input aria-label="Set 2 reps" inputmode="numeric" value="9" style="height:52px; width:100%; box-sizing:border-box; border:0; border-radius:14px; background:var(--s2); color:var(--tx); text-align:center; font-family:var(--fd); font-size:20px; font-weight:600">
<button type="button" aria-label="Set 2 done" aria-pressed="true" style="width:52px; height:52px; border-radius:26px; border:0; background:var(--ac); color:var(--onac); display:flex; align-items:center; justify-content:center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
</div>
<div style="display:grid; grid-template-columns:28px minmax(0, 1fr) minmax(0, 1fr) 52px; gap:8px; align-items:center">
<span style="font-family:var(--fd); font-size:18px; font-weight:700; color:var(--tx)">3</span>
<input aria-label="Set 3 weight in kg" inputmode="decimal" value="27.5" style="height:52px; width:100%; box-sizing:border-box; border:2px solid var(--mark); border-radius:14px; background:var(--s2); color:var(--tx); text-align:center; font-family:var(--fd); font-size:20px; font-weight:600">
<input aria-label="Set 3 reps" inputmode="numeric" value="10" style="height:52px; width:100%; box-sizing:border-box; border:2px solid var(--mark); border-radius:14px; background:var(--s2); color:var(--tx); text-align:center; font-family:var(--fd); font-size:20px; font-weight:600">
<button type="button" aria-label="Set 3 done" aria-pressed="false" style="width:52px; height:52px; border-radius:26px; border:2px solid var(--mute); background:transparent; color:var(--tx2); display:flex; align-items:center; justify-content:center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
</div>
<button type="button" style="align-self:flex-start; height:44px; padding:0 4px; border:0; background:transparent; color:var(--act); font-size:15px; font-weight:600; display:flex; align-items:center; gap:6px">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
Add set
</button>
</div>

<div style="display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:8px; padding-top:16px; border-top:1px solid var(--line)">
<button type="button" style="height:44px; border-radius:22px; border:0; background:var(--s2); color:var(--tx); font-size:14px; font-weight:600">Add note</button>
<button type="button" style="height:44px; border-radius:22px; border:0; background:var(--s2); color:var(--tx); font-size:14px; font-weight:600">Swap</button>
<button type="button" style="height:44px; border-radius:22px; border:0; background:var(--s2); color:var(--tx); font-size:14px; font-weight:600">Do later</button>
</div>
</section>

<h2 style="margin:0; padding:12px 4px 0; font-size:15px; line-height:20px; font-weight:600; color:var(--tx2)">Up next</h2>
<section style="background:var(--s1); box-shadow:var(--sh); border-radius:24px; padding:0 20px; display:flex; flex-direction:column">
<div style="display:flex; justify-content:space-between; align-items:center; min-height:56px; border-bottom:1px solid var(--line)">
<span style="font-size:16px; font-weight:600">Leg curl</span>
<span style="font-size:14px; color:var(--tx2)">3 × 12 at 15 kg</span>
</div>
<div style="display:flex; justify-content:space-between; align-items:center; min-height:56px">
<span style="font-size:16px; font-weight:600">Stationary bike</span>
<span style="font-size:14px; color:var(--tx2)">10 min</span>
</div>
</section>
</main>

<div style="margin-top:auto; padding:12px 20px 28px; background:var(--bg)">
<button type="button" style="width:100%; height:56px; border-radius:28px; border:0; background:var(--ac); color:var(--onac); font-size:16px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px">
Next exercise
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
