[versions]
agp = "9.5.3"
kotlin = "2.4.21"
ksp = "2.3.14"
compose = "2026.11.01"
room = "2.8.5"
media3 = "1.11.1"
okhttp = "5.5.1"
work = "2.12.0"
ktlintGradle = "14.2.0"
ktlint = "1.8.0"
detekt = "1.23.8"
dependencyCheck = "13.0.0"

[plugins]
sonarqube = { id = "org.sonarqube", version = "7.6.0.18749" }
stability-analyzer = { id = "com.github.skydoves.compose.stability.analyzer", version = "0.15.0" }
dependency-check = { id = "org.owasp.dependencycheck", version.ref = "dependencyCheck" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

[libraries]
guava-android = { module = "com.google.guava:guava", version = "33.8.0-android" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version = "1.3.0" }
android-security-lints = { module = "com.android.security.lint:lint", version = "1.0.4" }
# Compose rules 0.5 and later require Detekt 2, which is still in alpha.
#noinspection NewerVersionAvailable
compose-rules-detekt = { module = "io.nlopez.compose.rules:detekt", version = "0.4.28" }
compose-rules-ktlint = { module = "io.nlopez.compose.rules:ktlint", version = "0.6.8" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons = { module = "androidx.compose.material:material-icons-extended", version = "1.7.8" }
compose-test-junit = { module = "androidx.compose.ui:ui-test-junit4" }
compose-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
exifinterface = { module = "androidx.exifinterface:exifinterface", version = "1.4.2" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
activity = { module = "androidx.activity:activity-compose", version = "1.13.0" }
lifecycle = { module = "androidx.lifecycle:lifecycle-runtime-compose", version = "2.11.1" }
viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version = "2.11.1" }
navigation = { module = "androidx.navigation:navigation-compose", version = "2.10.2" }
serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.13.0" }
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version = "1.11.0" }
work = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
work-testing = { module = "androidx.work:work-testing", version.ref = "work" }
test-core = { module = "androidx.test:core", version = "1.7.0" }
glance = { module = "androidx.glance:glance-appwidget", version = "1.2.0" }
health = { module = "androidx.health.connect:connect-client", version = "1.1.0" }
junit = { module = "junit:junit", version = "4.13.2" }
androidx-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
test-runner = { module = "androidx.test:runner", version = "1.7.0" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version = "3.7.0" }
robolectric = { module = "org.robolectric:robolectric", version = "4.18.1" }
