[versions]
agp = "9.5.1"
kotlin = "2.4.21"
ksp = "2.3.13"
compose = "2026.09.00"
room = "2.8.5"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
activity = { module = "androidx.activity:activity-compose", version = "1.13.0" }
lifecycle = { module = "androidx.lifecycle:lifecycle-runtime-compose", version = "2.11.0" }
viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version = "2.11.0" }
navigation = { module = "androidx.navigation:navigation-compose", version = "2.10.2" }
serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.13.0" }
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version = "1.11.0" }
work = { module = "androidx.work:work-runtime-ktx", version = "2.12.0" }
glance = { module = "androidx.glance:glance-appwidget", version = "1.2.0" }
health = { module = "androidx.health.connect:connect-client", version = "1.1.0" }
junit = { module = "junit:junit", version = "4.13.2" }
androidx-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
test-runner = { module = "androidx.test:runner", version = "1.7.0" }
robolectric = { module = "org.robolectric:robolectric", version = "4.17" }
